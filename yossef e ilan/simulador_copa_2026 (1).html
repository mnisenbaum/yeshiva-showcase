<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yeshiva rio - Copa 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #f3f4f6;
        }

        .gold-gradient {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        .gold-bg {
            background: linear-gradient(135deg, #bf953f, #b38728);
        }

        .gold-border {
            border-color: #b38728;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .penalties-container {
            display: none;
        }
        .penalties-container.active {
            display: flex;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-yellow-500 selection:text-black overflow-x-hidden">

    <!-- Cabeçalho (Header) -->
    <header class="relative pt-12 pb-8 px-4 text-center border-b border-white/10 glass-panel z-10">
        <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-25">
            <div class="absolute -top-[50%] -left-[10%] w-[50%] h-[200%] bg-yellow-600/20 blur-[120px] rounded-full mix-blend-screen"></div>
        </div>
        
        <div class="relative z-10 flex flex-col items-center">
            <!-- Contentor da Imagem do Logótipo Oficial -->
            <div class="relative mb-6 select-none group">
                <!-- Efeito de brilho dourado atrás da imagem -->
                <div class="absolute inset-0 bg-yellow-600/30 rounded-full blur-2xl group-hover:bg-yellow-500/40 transition-all duration-500"></div>
                <!-- Moldura Premium da Imagem -->
                <div class="relative bg-neutral-900 p-2 rounded-2xl border border-white/10 shadow-2xl overflow-hidden w-32 h-32 md:w-40 md:h-40 flex items-center justify-center">
                    <img src="image_393603.png" alt="Logótipo Oficial da Copa do Mundo 2026" class="w-full h-full object-contain rounded-xl" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23bf953f%22><path d=%22M18 2H6v2h12V2zm-2 4H8v2h8V6zm4 4H4v2h16v-2zm-2 4H6v2h12v-2zm-4 4H10v2h4v-2z%22/></svg>';">
                </div>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-black tracking-widest uppercase text-white mb-2">
                yeshiva rio
            </h1>
            <h2 class="text-lg md:text-xl font-semibold text-neutral-400 tracking-wide uppercase">
                Simulador Oficial <span class="gold-gradient font-bold">Copa do Mundo</span>
            </h2>
        </div>
    </header>

    <!-- Conteúdo Principal (Main) -->
    <main class="flex-grow container mx-auto px-4 py-12 relative z-10">
        
        <!-- Fase de Grupos -->
        <section id="stage-groups" class="block">
            <div class="flex flex-col md:flex-row justify-between items-center mb-10 space-y-4 md:space-y-0">
                <div>
                    <h3 class="text-3xl font-black text-white">Fase de Grupos</h3>
                    <p class="text-neutral-500 mt-1">Insira os resultados para definir os classificados.</p>
                </div>
                <button onclick="simulateGroups()" class="gold-bg text-black px-6 py-3 rounded-full font-bold shadow-[0_0_20px_rgba(191,149,63,0.3)] hover:scale-105 transition-transform uppercase tracking-wider text-sm">
                    Simular Todos os Grupos (Sorteio)
                </button>
            </div>

            <div id="groups-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Grupos injetados via JS -->
            </div>

            <div class="mt-16 flex justify-center">
                <button onclick="generateBracket()" class="group relative px-8 py-4 bg-neutral-900 border-2 border-yellow-600 rounded-full overflow-hidden hover:bg-yellow-600 transition-colors duration-300">
                    <span class="relative z-10 text-yellow-500 group-hover:text-black font-black text-lg tracking-widest uppercase transition-colors">
                        Avançar para o Mata-Mata
                    </span>
                </button>
            </div>
        </section>

        <!-- Fase Eliminatória -->
        <section id="stage-knockout" class="hidden">
            <div class="flex flex-col md:flex-row justify-between items-center mb-12 border-b border-neutral-800 pb-6">
                <div>
                    <h3 class="text-3xl font-black text-white">Fase Eliminatória</h3>
                    <p class="text-neutral-500 mt-1">Apenas os melhores chegam ao topo.</p>
                </div>
                <button onclick="backToGroups()" class="px-6 py-2 rounded-full border border-neutral-600 text-neutral-400 hover:text-white hover:border-white transition-colors text-sm font-bold uppercase mt-4 md:mt-0">
                    Voltar aos Grupos
                </button>
            </div>

            <div id="knockout-container" class="space-y-16">
                <!-- Mata-mata injetado via JS -->
            </div>

            <div id="champion-container" class="hidden mt-20 p-1 relative rounded-3xl overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-yellow-600 via-yellow-200 to-yellow-600 animate-pulse"></div>
                <div class="bg-black relative z-10 p-12 rounded-[22px] text-center glass-panel">
                    <h2 class="text-2xl md:text-3xl font-bold text-neutral-400 uppercase tracking-widest mb-4">Campeão do Mundo</h2>
                    <p id="champion-name" class="text-5xl md:text-7xl font-black gold-gradient uppercase tracking-tighter">
                        ---
                    </p>
                </div>
            </div>
        </section>

    </main>

    <!-- Rodapé (Footer) -->
    <footer class="mt-auto border-t border-neutral-900 bg-black/50 py-10 text-center backdrop-blur-md relative z-10">
        <p class="text-2xl md:text-3xl font-serif text-yellow-600 mb-4 tracking-wider drop-shadow-md" dir="rtl">
            יחי אדוננו מורנו ורבנו מלך המשיח לעולם ועד
        </p>
        <p class="text-xs md:text-sm font-semibold tracking-[0.3em] text-neutral-500 uppercase">
            iechi adoneinu moreinu verabeinu melech hamashiach leolam vaed
        </p>
    </footer>

    <script>
        const GROUPS = {
            A: [{ id: 'MEX', name: 'México' }, { id: 'RSA', name: 'África do Sul' }, { id: 'KOR', name: 'Coreia do Sul' }, { id: 'CZE', name: 'Rep. Checa' }],
            B: [{ id: 'CAN', name: 'Canadá' }, { id: 'BIH', name: 'Bósnia e H.' }, { id: 'QAT', name: 'Catar' }, { id: 'SUI', name: 'Suíça' }],
            C: [{ id: 'BRA', name: 'Brasil' }, { id: 'MAR', name: 'Marrocos' }, { id: 'HAI', name: 'Haiti' }, { id: 'SCO', name: 'Escócia' }],
            D: [{ id: 'USA', name: 'EUA' }, { id: 'PAR', name: 'Paraguai' }, { id: 'AUS', name: 'Austrália' }, { id: 'TUR', name: 'Turquia' }],
            E: [{ id: 'GER', name: 'Alemanha' }, { id: 'CUW', name: 'Curaçau' }, { id: 'CIV', name: 'Costa do Marfim' }, { id: 'ECU', name: 'Equador' }],
            F: [{ id: 'NED', name: 'Países Baixos' }, { id: 'JPN', name: 'Japão' }, { id: 'SWE', name: 'Suécia' }, { id: 'TUN', name: 'Tunísia' }],
            G: [{ id: 'BEL', name: 'Bélgica' }, { id: 'EGY', name: 'Egito' }, { id: 'IRN', name: 'Irão' }, { id: 'NZL', name: 'Nova Zelândia' }],
            H: [{ id: 'ESP', name: 'Espanha' }, { id: 'CPV', name: 'Cabo Verde' }, { id: 'KSA', name: 'Arábia Saudita' }, { id: 'URU', name: 'Uruguai' }],
            I: [{ id: 'FRA', name: 'França' }, { id: 'SEN', name: 'Senegal' }, { id: 'IRQ', name: 'Iraque' }, { id: 'NOR', name: 'Noruega' }],
            J: [{ id: 'ARG', name: 'Argentina' }, { id: 'ALG', name: 'Argélia' }, { id: 'AUT', name: 'Áustria' }, { id: 'JOR', name: 'Jordânia' }],
            K: [{ id: 'POR', name: 'Portugal' }, { id: 'COD', name: 'RD Congo' }, { id: 'UZB', name: 'Usbequistão' }, { id: 'COL', name: 'Colômbia' }],
            L: [{ id: 'ENG', name: 'Inglaterra' }, { id: 'CRO', name: 'Croácia' }, { id: 'GHA', name: 'Gana' }, { id: 'PAN', name: 'Panamá' }]
        };

        const GROUP_MATCHES = [
            [0, 1], [2, 3], // Jornada 1
            [0, 2], [1, 3], // Jornada 2
            [0, 3], [1, 2]  // Jornada 3
        ];

        let state = {
            groupScores: {},
            knockoutScores: {},
            knockoutBracket: {
                r32: [], r16: [], qf: [], sf: [], final: []
            }
        };

        // --- INICIALIZAÇÃO DOS GRUPOS ---
        function initGroups() {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            Object.keys(GROUPS).forEach(letter => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'glass-panel rounded-2xl overflow-hidden shadow-2xl transition-all duration-300 hover:border-yellow-600/50';
                
                let html = `
                    <div class="bg-neutral-900 border-b border-neutral-800 p-3 text-center">
                        <span class="text-xl font-black text-white">GRUPO <span class="gold-gradient">${letter}</span></span>
                    </div>
                    <div class="p-4">
                        <table class="w-full text-xs text-center mb-6">
                            <thead>
                                <tr class="text-neutral-500 uppercase tracking-wider border-b border-neutral-800">
                                    <th class="text-left pb-2 font-bold w-1/2">Seleção</th>
                                    <th class="pb-2 font-bold">P</th>
                                    <th class="pb-2 font-bold">V</th>
                                    <th class="pb-2 font-bold">SG</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-${letter}">
                                <!-- Classificações injetadas via JS -->
                            </tbody>
                        </table>
                        <div class="space-y-2">
                `;

                GROUP_MATCHES.forEach((match, idx) => {
                    const matchId = `${letter}-${idx}`;
                    const tHome = GROUPS[letter][match[0]];
                    const tAway = GROUPS[letter][match[1]];
                    
                    html += `
                        <div class="flex items-center justify-between bg-neutral-900/50 p-2 rounded-xl border border-neutral-800">
                            <span class="w-1/3 text-right font-semibold text-neutral-300 truncate pr-1 text-xs md:text-sm">${tHome.id}</span>
                            <div class="flex space-x-1 items-center justify-center">
                                <input type="number" min="0" id="in-${matchId}-h" oninput="updateGroupScore('${matchId}')" class="w-8 h-8 text-center bg-black border border-neutral-700 rounded text-white font-bold focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none transition-all" />
                                <span class="text-neutral-600 font-black text-xs">x</span>
                                <input type="number" min="0" id="in-${matchId}-a" oninput="updateGroupScore('${matchId}')" class="w-8 h-8 text-center bg-black border border-neutral-700 rounded text-white font-bold focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none transition-all" />
                            </div>
                            <span class="w-1/3 text-left font-semibold text-neutral-300 truncate pl-1 text-xs md:text-sm">${tAway.id}</span>
                            
                            <!-- Botão Individual de Sorteio de Jogo do Grupo -->
                            <button onclick="randomizeGroupMatch('${matchId}')" class="text-neutral-500 hover:text-yellow-500 transition-colors p-1 text-sm flex items-center justify-center" title="Sortear jogo">
                                🎲
                            </button>
                        </div>
                    `;
                });

                html += `</div></div>`;
                groupDiv.innerHTML = html;
                container.appendChild(groupDiv);
                
                updateGroupTable(letter);
            });
        }

        function updateGroupScore(matchId) {
            const hVal = document.getElementById(`in-${matchId}-h`).value;
            const aVal = document.getElementById(`in-${matchId}-a`).value;
            
            state.groupScores[matchId] = { home: hVal, away: aVal };
            
            const letter = matchId.split('-')[0];
            updateGroupTable(letter);
        }

        // Simulação de Jogo de Grupo Individual
        function randomizeGroupMatch(matchId) {
            const hInput = document.getElementById(`in-${matchId}-h`);
            const aInput = document.getElementById(`in-${matchId}-a`);
            
            hInput.value = Math.floor(Math.random() * 4);
            aInput.value = Math.floor(Math.random() * 4);
            
            state.groupScores[matchId] = { home: hInput.value, away: aInput.value };
            
            const letter = matchId.split('-')[0];
            updateGroupTable(letter);
        }

        function calculateGroupStandings(letter) {
            const teams = GROUPS[letter].map(t => ({ ...t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0 }));
            
            GROUP_MATCHES.forEach((match, idx) => {
                const matchId = `${letter}-${idx}`;
                const score = state.groupScores[matchId];
                
                if (score && score.home !== '' && score.away !== '') {
                    const h = parseInt(score.home);
                    const a = parseInt(score.away);
                    if (!isNaN(h) && !isNaN(a)) {
                        const tHome = teams[match[0]];
                        const tAway = teams[match[1]];
                        
                        tHome.gf += h; tHome.ga += a; tHome.gd += (h - a);
                        tAway.gf += a; tAway.ga += h; tAway.gd += (a - h);
                        
                        if (h > a) { tHome.p += 3; tHome.w += 1; tAway.l += 1; }
                        else if (h < a) { tAway.p += 3; tAway.w += 1; tHome.l += 1; }
                        else { tHome.p += 1; tAway.p += 1; tHome.d += 1; tAway.d += 1; }
                    }
                }
            });

            return teams.sort((a, b) => {
                if (b.p !== a.p) return b.p - a.p;
                if (b.gd !== a.gd) return b.gd - a.gd;
                if (b.gf !== a.gf) return b.gf - a.gf;
                return a.name.localeCompare(b.name);
            });
        }

        function updateGroupTable(letter) {
            const standings = calculateGroupStandings(letter);
            const tbody = document.getElementById(`tbody-${letter}`);
            let html = '';
            
            standings.forEach((t, i) => {
                let textClass = "text-neutral-400";
                let bgClass = "";
                if (i < 2) {
                    textClass = "text-white font-bold";
                    bgClass = "bg-neutral-800/30";
                } else if (i === 2) {
                    textClass = "text-yellow-500 font-medium";
                }
                
                html += `
                    <tr class="border-b border-neutral-800/50 last:border-0 ${bgClass}">
                        <td class="text-left py-2 px-1 truncate ${textClass}">${t.name}</td>
                        <td class="py-2 text-white font-semibold">${t.p}</td>
                        <td class="py-2 text-neutral-400">${t.w}</td>
                        <td class="py-2 text-neutral-400">${t.gd > 0 ? '+'+t.gd : t.gd}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function simulateGroups() {
            Object.keys(GROUPS).forEach((letter) => {
                GROUP_MATCHES.forEach((m, idx) => {
                    const matchId = `${letter}-${idx}`;
                    const hInput = document.getElementById(`in-${matchId}-h`);
                    const aInput = document.getElementById(`in-${matchId}-a`);
                    
                    if (hInput.value === '' || aInput.value === '') {
                        hInput.value = Math.floor(Math.random() * 4);
                        aInput.value = Math.floor(Math.random() * 4);
                        state.groupScores[matchId] = { home: hInput.value, away: aInput.value };
                    }
                });
                updateGroupTable(letter);
            });
        }

        // --- MATA-MATA (FASE ELIMINATÓRIA) ---
        function generateBracket() {
            const firsts = [];
            const seconds = [];
            const thirds = [];

            Object.keys(GROUPS).forEach((l) => {
                const st = calculateGroupStandings(l);
                firsts.push(st[0]);
                seconds.push(st[1]);
                thirds.push(st[2]);
            });

            thirds.sort((a, b) => {
                if (b.p !== a.p) return b.p - a.p;
                if (b.gd !== a.gd) return b.gd - a.gd;
                if (b.gf !== a.gf) return b.gf - a.gf;
                return 0; 
            });

            const bestThirds = thirds.slice(0, 8);

            state.knockoutBracket.r32 = [
                { id: 'M1', home: firsts[0], away: bestThirds[0], nextId: 'M17', nextPos: 'home' }, 
                { id: 'M2', home: firsts[1], away: bestThirds[1], nextId: 'M17', nextPos: 'away' }, 
                { id: 'M3', home: firsts[2], away: bestThirds[2], nextId: 'M18', nextPos: 'home' },
                { id: 'M4', home: firsts[3], away: bestThirds[3], nextId: 'M18', nextPos: 'away' },
                { id: 'M5', home: firsts[4], away: bestThirds[4], nextId: 'M19', nextPos: 'home' },
                { id: 'M6', home: firsts[5], away: bestThirds[5], nextId: 'M19', nextPos: 'away' },
                { id: 'M7', home: firsts[6], away: bestThirds[6], nextId: 'M20', nextPos: 'home' },
                { id: 'M8', home: firsts[7], away: bestThirds[7], nextId: 'M20', nextPos: 'away' },
                { id: 'M9', home: firsts[8], away: seconds[0], nextId: 'M21', nextPos: 'home' },  
                { id: 'M10', home: firsts[9], away: seconds[1], nextId: 'M21', nextPos: 'away' }, 
                { id: 'M11', home: firsts[10], away: seconds[2], nextId: 'M22', nextPos: 'home' }, 
                { id: 'M12', home: firsts[11], away: seconds[3], nextId: 'M22', nextPos: 'away' }, 
                { id: 'M13', home: seconds[4], away: seconds[5], nextId: 'M23', nextPos: 'home' }, 
                { id: 'M14', home: seconds[6], away: seconds[7], nextId: 'M23', nextPos: 'away' }, 
                { id: 'M15', home: seconds[8], away: seconds[9], nextId: 'M24', nextPos: 'home' }, 
                { id: 'M16', home: seconds[10], away: seconds[11], nextId: 'M24', nextPos: 'away' }, 
            ];

            // Estrutura vazia para as fases seguintes
            state.knockoutBracket.r16 = Array.from({length: 8}, (_, i) => ({ id: `M${17+i}`, home: null, away: null, nextId: `M${25 + Math.floor(i/2)}`, nextPos: i%2===0 ? 'home' : 'away' }));
            state.knockoutBracket.qf = Array.from({length: 4}, (_, i) => ({ id: `M${25+i}`, home: null, away: null, nextId: `M${29 + Math.floor(i/2)}`, nextPos: i%2===0 ? 'home' : 'away' }));
            state.knockoutBracket.sf = Array.from({length: 2}, (_, i) => ({ id: `M${29+i}`, home: null, away: null, nextId: 'M31', nextPos: i===0 ? 'home' : 'away' }));
            state.knockoutBracket.final = [{ id: 'M31', home: null, away: null, nextId: null, nextPos: null }];

            document.getElementById('stage-groups').classList.add('hidden');
            document.getElementById('stage-knockout').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            renderKnockout();
        }

        function backToGroups() {
            document.getElementById('stage-knockout').classList.add('hidden');
            document.getElementById('stage-groups').classList.remove('hidden');
        }

        function renderKnockout() {
            const container = document.getElementById('knockout-container');
            container.innerHTML = '';

            const stages = [
                { title: '16-Avos de Final', data: state.knockoutBracket.r32 },
                { title: 'Oitavas de Final', data: state.knockoutBracket.r16 },
                { title: 'Quartas de Final', data: state.knockoutBracket.qf },
                { title: 'Semifinal', data: state.knockoutBracket.sf },
                { title: 'FINAL', data: state.knockoutBracket.final }
            ];

            stages.forEach(stage => {
                let html = `
                    <div>
                        <h4 class="text-xl font-black text-center mb-6 uppercase tracking-[0.2em] gold-gradient">${stage.title}</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                `;

                stage.data.forEach(match => {
                    html += `
                        <div class="glass-panel p-5 pt-7 rounded-2xl border border-neutral-800 relative group flex flex-col justify-center min-h-[120px] transition-all hover:border-yellow-600/35">
                            
                            <!-- Botão de Sorteio do Mata-Mata -->
                            <button onclick="randomizeKnockoutMatch('${match.id}')" ${!match.home || !match.away ? 'disabled' : ''} class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-neutral-900 border border-neutral-800 hover:border-yellow-500 text-neutral-400 hover:text-yellow-500 rounded-full px-3 py-0.5 text-[10px] font-bold shadow-md transition-all disabled:opacity-0 disabled:pointer-events-none z-20 flex items-center gap-1">
                                🎲 Sortear
                            </button>

                            <div class="flex justify-between items-center w-full relative z-10">
                                <div class="w-2/5 text-right font-bold text-sm truncate pr-2 text-white transition-colors" id="name-${match.id}-h">
                                    ${match.home ? match.home.name : '<span class="text-neutral-600 font-normal">A Definir</span>'}
                                </div>
                                <div class="w-1/5 flex flex-col items-center">
                                    <div class="flex items-center space-x-1">
                                        <input type="number" min="0" id="ko-${match.id}-h" oninput="updateKnockoutScore('${match.id}')" ${!match.home || !match.away ? 'disabled' : ''} class="w-8 h-8 text-center bg-black border border-neutral-700 rounded text-white font-bold outline-none focus:border-yellow-500 disabled:opacity-30" />
                                        <span class="text-neutral-600 font-black text-xs">-</span>
                                        <input type="number" min="0" id="ko-${match.id}-a" oninput="updateKnockoutScore('${match.id}')" ${!match.home || !match.away ? 'disabled' : ''} class="w-8 h-8 text-center bg-black border border-neutral-700 rounded text-white font-bold outline-none focus:border-yellow-500 disabled:opacity-30" />
                                    </div>
                                </div>
                                <div class="w-2/5 text-left font-bold text-sm truncate pl-2 text-white transition-colors" id="name-${match.id}-a">
                                    ${match.away ? match.away.name : '<span class="text-neutral-600 font-normal">A Definir</span>'}
                                </div>
                            </div>

                            <!-- Pênaltis -->
                            <div id="pen-${match.id}" class="penalties-container mt-3 pt-3 border-t border-neutral-800/50 justify-center items-center space-x-2">
                                <span class="text-[10px] uppercase tracking-widest text-neutral-500 font-bold">Pênaltis</span>
                                <input type="number" min="0" id="kopen-${match.id}-h" oninput="updateKnockoutScore('${match.id}')" class="w-7 h-7 text-center bg-neutral-900 border border-neutral-700 rounded text-yellow-500 font-bold outline-none text-xs" />
                                <span class="text-neutral-700 text-xs font-black">x</span>
                                <input type="number" min="0" id="kopen-${match.id}-a" oninput="updateKnockoutScore('${match.id}')" class="w-7 h-7 text-center bg-neutral-900 border border-neutral-700 rounded text-yellow-500 font-bold outline-none text-xs" />
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });

            restoreKnockoutValues();
        }

        // Sorteio Individual no Mata-Mata
        function randomizeKnockoutMatch(matchId) {
            const match = getMatchInfo(matchId);
            if (!match || !match.home || !match.away) return;

            const h = Math.floor(Math.random() * 4);
            const a = Math.floor(Math.random() * 4);

            document.getElementById(`ko-${matchId}-h`).value = h;
            document.getElementById(`ko-${matchId}-a`).value = a;

            if (h === a) {
                let ph = Math.floor(Math.random() * 4) + 3;
                let pa = Math.floor(Math.random() * 4) + 3;
                while (ph === pa) {
                    pa = Math.floor(Math.random() * 4) + 3;
                }
                setTimeout(() => {
                    document.getElementById(`kopen-${matchId}-h`).value = ph;
                    document.getElementById(`kopen-${matchId}-a`).value = pa;
                    updateKnockoutScore(matchId);
                }, 50);
            } else {
                updateKnockoutScore(matchId);
            }
        }

        function restoreKnockoutValues() {
            Object.keys(state.knockoutScores).forEach(id => {
                const s = state.knockoutScores[id];
                if(document.getElementById(`ko-${id}-h`)) document.getElementById(`ko-${id}-h`).value = s.home;
                if(document.getElementById(`ko-${id}-a`)) document.getElementById(`ko-${id}-a`).value = s.away;
                if(document.getElementById(`kopen-${id}-h`)) document.getElementById(`kopen-${id}-h`).value = s.penHome || '';
                if(document.getElementById(`kopen-${id}-a`)) document.getElementById(`kopen-${id}-a`).value = s.penAway || '';
                checkPenaltiesVisibility(id);
            });
            propagateWinners();
        }

        function checkPenaltiesVisibility(id) {
            const h = document.getElementById(`ko-${id}-h`).value;
            const a = document.getElementById(`ko-${id}-a`).value;
            const penDiv = document.getElementById(`pen-${id}`);
            if (h !== '' && a !== '' && h === a) {
                penDiv.classList.add('active');
            } else {
                penDiv.classList.remove('active');
                if(document.getElementById(`kopen-${id}-h`)) document.getElementById(`kopen-${id}-h`).value = '';
                if(document.getElementById(`kopen-${id}-a`)) document.getElementById(`kopen-${id}-a`).value = '';
                if(state.knockoutScores[id]) {
                    state.knockoutScores[id].penHome = '';
                    state.knockoutScores[id].penAway = '';
                }
            }
        }

        function updateKnockoutScore(matchId) {
            const hVal = document.getElementById(`ko-${matchId}-h`).value;
            const aVal = document.getElementById(`ko-${matchId}-a`).value;
            
            checkPenaltiesVisibility(matchId);
            
            const penHVal = document.getElementById(`kopen-${matchId}-h`) ? document.getElementById(`kopen-${matchId}-h`).value : '';
            const penAVal = document.getElementById(`kopen-${matchId}-a`) ? document.getElementById(`kopen-${matchId}-a`).value : '';

            state.knockoutScores[matchId] = { home: hVal, away: aVal, penHome: penHVal, penAway: penAVal };
            
            propagateWinners();
        }

        function getMatchInfo(id) {
            const allStages = ['r32', 'r16', 'qf', 'sf', 'final'];
            for (let s of allStages) {
                const match = state.knockoutBracket[s].find(m => m.id === id);
                if (match) return match;
            }
            return null;
        }

        function getWinner(matchId) {
            const match = getMatchInfo(matchId);
            if (!match || !match.home || !match.away) return null;

            const score = state.knockoutScores[matchId];
            if (!score || score.home === '' || score.away === '') return null;

            const h = parseInt(score.home);
            const a = parseInt(score.away);

            if (h > a) return match.home;
            if (a > h) return match.away;

            if (score.penHome !== '' && score.penAway !== '') {
                const ph = parseInt(score.penHome);
                const pa = parseInt(score.penAway);
                if (ph > pa) return match.home;
                if (pa > ph) return match.away;
            }
            return null;
        }

        function propagateWinners() {
            const allStages = ['r32', 'r16', 'qf', 'sf', 'final'];
            let champion = null;

            allStages.forEach(stageName => {
                state.knockoutBracket[stageName].forEach(match => {
                    const winner = getWinner(match.id);
                    
                    const labelH = document.getElementById(`name-${match.id}-h`);
                    const labelA = document.getElementById(`name-${match.id}-a`);
                    if(labelH && labelA && match.home && match.away) {
                        labelH.className = `w-2/5 text-right font-bold text-sm truncate pr-2 transition-colors ${winner?.id === match.home.id ? 'text-yellow-500' : (winner ? 'text-neutral-600' : 'text-white')}`;
                        labelA.className = `w-2/5 text-left font-bold text-sm truncate pl-2 transition-colors ${winner?.id === match.away.id ? 'text-yellow-500' : (winner ? 'text-neutral-600' : 'text-white')}`;
                    }

                    if (match.nextId) {
                        const nextMatch = getMatchInfo(match.nextId);
                        if (nextMatch) {
                            if (match.nextPos === 'home') nextMatch.home = winner;
                            else nextMatch.away = winner;
                            
                            const nextLabel = document.getElementById(`name-${nextMatch.id}-${match.nextPos === 'home' ? 'h' : 'a'}`);
                            if(nextLabel) {
                                nextLabel.innerHTML = winner ? winner.name : '<span class="text-neutral-600 font-normal">A Definir</span>';
                                nextLabel.classList.remove('text-neutral-600', 'text-yellow-500');
                                nextLabel.classList.add('text-white');
                            }
                            
                            const inH = document.getElementById(`ko-${nextMatch.id}-h`);
                            const inA = document.getElementById(`ko-${nextMatch.id}-a`);
                            if(inH && inA) {
                                if (nextMatch.home && nextMatch.away) {
                                    inH.removeAttribute('disabled');
                                    inA.removeAttribute('disabled');
                                } else {
                                    inH.setAttribute('disabled', 'true');
                                    inA.setAttribute('disabled', 'true');
                                    inH.value = ''; inA.value = '';
                                    if(document.getElementById(`pen-${nextMatch.id}`)) document.getElementById(`pen-${nextMatch.id}`).classList.remove('active');
                                    state.knockoutScores[nextMatch.id] = { home: '', away: '', penHome: '', penAway: '' };
                                }
                            }
                        }
                    } else if (stageName === 'final') {
                        champion = winner;
                    }
                });
            });

            const champContainer = document.getElementById('champion-container');
            const champName = document.getElementById('champion-name');
            if (champion) {
                champContainer.classList.remove('hidden');
                champName.textContent = champion.name;
                setTimeout(() => {
                    champContainer.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }, 300);
            } else {
                champContainer.classList.add('hidden');
                champName.textContent = '---';
            }
        }

        window.onload = initGroups;
    </script>
</body>
</html>
