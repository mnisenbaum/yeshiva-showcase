<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produções dos Alunos — Yeshivá Rio 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f1a;
      --surface: #161929;
      --surface-2: #1c1f35;
      --border: #252a42;
      --text: #e8eaf6;
      --text-2: #8890b0;
      --radius: 12px;
      --radius-sm: 8px;

      --purple: #6c63ff;
      --cyan: #00c9ff;
      --orange: #f97316;
      --green: #43e97b;
      --gold: #f7b538;
      --pink: #ff6584;
      --violet: #c084fc;
    }

    [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-2: #f0f0f5;
      --border: #e0e0e8;
      --text: #1a1a2e;
      --text-2: #666680;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      padding: 0 20px;
    }

    /* ── STARS (dark only) ── */
    [data-theme="dark"] body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  50%, rgba(255,255,255,0.4) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 0 24px;
    }

    .header-top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn:hover {
      border-color: var(--accent-color, var(--purple));
      background: var(--surface-2);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      justify-content: center;
      font-size: 1.15rem;
    }

    .btn-upload {
      background: var(--purple);
      color: #fff;
      border-color: var(--purple);
    }

    .btn-upload:hover {
      background: #7f78ff !important;
      border-color: #7f78ff !important;
    }

    .badge {
      display: inline-block;
      background: rgba(108, 99, 255, 0.15);
      border: 1px solid rgba(108, 99, 255, 0.4);
      color: #a89fff;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    [data-theme="light"] .badge {
      background: rgba(108, 99, 255, 0.08);
      border-color: rgba(108, 99, 255, 0.25);
      color: var(--purple);
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(135deg, #a89fff 0%, #ff6584 50%, #43e97b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--text-2);
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto 8px;
    }

    /* ── FILTERS ── */
    .filters {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 0 24px;
      justify-content: center;
    }

    .filter-chip {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-2);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-chip:hover {
      border-color: var(--text-2);
      color: var(--text);
    }

    .filter-chip.active {
      border-color: var(--accent-color, var(--purple));
      background: rgba(108, 99, 255, 0.12);
      color: var(--accent-color, var(--purple));
    }

    .filter-chip[data-color] {
      --accent-color: attr(data-color color);
    }

    [data-theme="light"] .filter-chip.active {
      background: rgba(108, 99, 255, 0.08);
    }

    .filter-section-label {
      position: relative;
      z-index: 1;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-2);
      margin: 8px 0 4px;
      text-align: center;
      width: 100%;
    }

    /* ── COUNTER ── */
    .counter {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-2);
      padding-bottom: 16px;
    }

    .counter strong {
      color: var(--text);
    }

    /* ── GRID ── */
    .grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding-bottom: 60px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-materia-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--card-color) 15%, transparent);
      color: var(--card-color);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-2);
      line-height: 1.6;
      flex: 1;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
    }

    .card-aluno {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--card-color);
    }

    .card-data {
      font-size: 0.72rem;
      color: var(--text-2);
    }

    .card-cta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--card-color);
      transition: gap 0.2s;
    }

    .card:hover .card-cta { gap: 8px; }

    /* ── STATES ── */
    .state {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
    }

    .state-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .state-text {
      color: var(--text-2);
      font-size: 0.95rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── FOOTER ── */
    .footer {
      position: relative;
      z-index: 1;
      width: 100%;
      text-align: center;
      color: var(--text-2);
      font-size: 0.8rem;
      padding: 0 20px 40px;
    }

    .footer a {
      color: var(--purple);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .header { padding: 24px 0 16px; }
      .header-top { margin-bottom: 20px; }
      .grid { grid-template-columns: 1fr; gap: 16px; }
      .card { padding: 20px 18px; }
      .filters { gap: 6px; }
      .filter-chip { font-size: 0.75rem; padding: 5px 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <a href="/enviar.html" class="btn btn-upload">+ Enviar trabalho</a>
        <button class="btn btn-icon" id="btnTheme" title="Alternar tema">🌙</button>
      </div>
      <div class="badge">Yeshivá Rio · 2026</div>
      <h1>Produções dos Alunos</h1>
      <p class="subtitle">
        Trabalhos criados nas aulas de Computação, Matemática, Física e outras disciplinas.
      </p>
    </div>

    <div id="filtersContainer">
      <div class="filter-section-label">Matéria</div>
      <div class="filters" id="materiaFilters"></div>
      <div class="filter-section-label">Aluno</div>
      <div class="filters" id="alunoFilters"></div>
    </div>

    <div class="counter" id="counter"></div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      Aula de Computação · <a href="https://github.com/mnisenbaum/yeshiva-showcase" target="_blank">Moishe Mayer</a>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'yeshiva-theme';

    const MATERIA_CONFIG = {
      computacao: { label: 'Computação',  icon: '💻', color: '#6c63ff' },
      matematica: { label: 'Matemática',  icon: '📐', color: '#00c9ff' },
      fisica:     { label: 'Física',      icon: '⚡', color: '#f97316' },
      biologia:   { label: 'Biologia',    icon: '🧬', color: '#43e97b' },
      historia:   { label: 'História',    icon: '📜', color: '#f7b538' },
      portugues:  { label: 'Português',   icon: '📖', color: '#ff6584' },
      ingles:     { label: 'Inglês',      icon: '🌎', color: '#c084fc' },
    };

    const MATERIA_ORDER = ['computacao', 'matematica', 'fisica', 'biologia', 'historia', 'portugues', 'ingles'];

    let allSubmissoes = [];
    let activeMateria = 'todas';
    let activeAluno = 'todos';

    // ── THEME ──
    function getTheme() {
      return localStorage.getItem(STORAGE_KEY) || 'dark';
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(STORAGE_KEY, theme);
      document.getElementById('btnTheme').textContent = theme === 'dark' ? '🌙' : '☀️';
    }

    setTheme(getTheme());

    document.getElementById('btnTheme').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ── DATE ──
    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
      });
    }

    // ── RENDER ──
    function render() {
      const grid = document.getElementById('grid');
      const counter = document.getElementById('counter');

      let filtered = [...allSubmissoes];

      if (activeMateria !== 'todas') {
        filtered = filtered.filter(s => s.materia === activeMateria);
      }

      if (activeAluno !== 'todos') {
        filtered = filtered.filter(s => s.aluno === activeAluno);
      }

      filtered.sort((a, b) => new Date(b.data) - new Date(a.data));

      counter.innerHTML = `<strong>${filtered.length}</strong> trabalho${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="state">
            <div class="state-icon">🔍</div>
            <div class="state-text">Nenhum trabalho encontrado com esses filtros.</div>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => {
        const config = MATERIA_CONFIG[s.materia] || { label: s.materia, icon: '📁', color: '#8890b0' };
        const encodedPath = s.arquivo.split('/').map(encodeURIComponent).join('/');
        const cor = config.color;

        return `
          <a class="card" href="${encodedPath}" target="_blank" style="--card-color: ${cor}">
            <div class="card-materia-tag" style="background: color-mix(in srgb, ${cor} 15%, transparent); color: ${cor}">
              ${config.icon} ${config.label}
            </div>
            <div class="card-title">${s.titulo}</div>
            ${s.descricao ? `<div class="card-desc">${s.descricao}</div>` : ''}
            <div class="card-bottom">
              <div class="card-aluno">${s.aluno}</div>
              <div class="card-data">${formatDate(s.data)}</div>
            </div>
            <div class="card-cta">Abrir &rarr;</div>
          </a>`;
      }).join('');
    }

    // ── FILTERS ──
    function buildFilters() {
      const materiaSet = new Set(allSubmissoes.map(s => s.materia));
      const alunoSet = new Set(allSubmissoes.map(s => s.aluno));

      const materiaContainer = document.getElementById('materiaFilters');
      const alunoContainer = document.getElementById('alunoFilters');

      // Subjects
      const materiaChips = MATERIA_ORDER
        .filter(m => materiaSet.has(m))
        .map(m => {
          const config = MATERIA_CONFIG[m];
          return `<button class="filter-chip" data-filter="materia" data-value="${m}" style="--accent-color: ${config.color}">${config.icon} ${config.label}</button>`;
        });

      materiaContainer.innerHTML = `
        <button class="filter-chip active" data-filter="materia" data-value="todas">Todas</button>
        ${materiaChips.join('')}`;

      // Students
      const alunoChips = [...alunoSet].sort().map(a =>
        `<button class="filter-chip" data-filter="aluno" data-value="${a}">${a}</button>`
      );

      alunoContainer.innerHTML = `
        <button class="filter-chip active" data-filter="aluno" data-value="todos">Todos</button>
        ${alunoChips.join('')}`;

      // Event listeners
      document.querySelectorAll('[data-filter="materia"]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-filter="materia"]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeMateria = btn.dataset.value;
          render();
        });
      });

      document.querySelectorAll('[data-filter="aluno"]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-filter="aluno"]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeAluno = btn.dataset.value;
          render();
        });
      });
    }

    // ── LOAD ──
    async function load() {
      const grid = document.getElementById('grid');
      const filtersContainer = document.getElementById('filtersContainer');
      const counter = document.getElementById('counter');

      filtersContainer.style.display = 'none';
      counter.style.display = 'none';
      grid.innerHTML = `
        <div class="state">
          <div class="spinner"></div>
          <div class="state-text">Carregando trabalhos...</div>
        </div>`;

      try {
        const res = await fetch('/data/manifest.json?_=' + Date.now());
        if (!res.ok) throw new Error('Falha ao carregar');
        const data = await res.json();
        allSubmissoes = data.submissoes || [];
        filtersContainer.style.display = '';
        counter.style.display = '';
        buildFilters();
        render();
      } catch {
        grid.innerHTML = `
          <div class="state">
            <div class="state-icon">⚠️</div>
            <div class="state-text">Erro ao carregar os trabalhos. Tente novamente mais tarde.</div>
          </div>`;
      }
    }

    load();
  </script>
</body>
</html>
